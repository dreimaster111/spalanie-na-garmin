name: Aktualizuj cene Pb95

on:
  schedule:
    - cron: "17 4,16 * * *"   # 2x dziennie (04:17 i 16:17 UTC) - cena zmienia sie raz na dobe
  workflow_dispatch: {}       # + reczne uruchomienie z zakladki Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testy logiki awaryjnej (bez sieci)
        run: python tools/test_fetch_pb95.py
      - name: Pobierz srednia cene Pb95
        run: python tools/fetch_pb95.py
      - name: Zapisz do repo
        run: |
          git config user.name "paliwo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pb95.txt data/pb95-historia.csv
          git diff --cached --quiet || git commit -m "Cena Pb95 [bot]"
          git push
